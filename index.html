  <style>
    :root {
      --paper: #E8D7B4;
      --ink: #3B2A1A;
      --ink-soft: #4F3D28;
      --sepia: #5A4630;
      --contour: #6B5232;
      --accent: #9A3F1C;
      --accent-text: #8F3C1A;
      --creek: #4E6A78;
      --cream: #EFE2C4;
      --display: 'Libre Caslon Display', Georgia, 'Times New Roman', serif;
      --serif: 'Libre Caslon Text', Georgia, serif;
      --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      position: relative;
      overflow-x: hidden;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      color: var(--ink);
      font-family: var(--mono);
      background-color: var(--paper);
      background-image:
        radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(110,72,30,0.30) 100%),
        linear-gradient(rgba(92,64,36,0.10) 1px, transparent 1px),
        linear-gradient(90deg, rgba(92,64,36,0.10) 1px, transparent 1px);
      background-size: 100% 100%, 48px 48px, 48px 48px;
      background-attachment: fixed, scroll, scroll;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--ink); }

    /* Map layer */
    .map {
      position: fixed; inset: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 0;
    }
    .layer { position: relative; z-index: 1; }

    .rule-top { display: flex; flex-direction: column; gap: 3px; padding: 14px 18px 0; }
    .rule-top span { display: block; background: var(--ink); }
    .rule-top span:first-child { height: 2px; }
    .rule-top span:last-child { height: 1px; }

    .wrap { width: 100%; max-width: 1120px; margin: 0 auto; padding: 0 24px; }

    header.wrap {
      padding-top: 30px;
      display: flex; flex-wrap: wrap; gap: 16px;
      justify-content: space-between; align-items: center;
    }
    .name {
      font-family: var(--serif); font-weight: 700; font-size: 22px;
      letter-spacing: 0.14em; text-transform: uppercase;
    }
    .status {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 7px 14px; border: 1px solid var(--ink); font-size: 13px;
    }

    main.wrap { flex: 1 1 auto; padding-top: 80px; padding-bottom: 64px; }
    .frame {
      position: relative; max-width: 760px; padding: 40px 32px;
      display: flex; flex-direction: column; gap: 28px;
    }
    .corner { position: absolute; width: 22px; height: 22px; }
    .corner.tl { top: 0; left: 0; }
    .corner.tr { top: 0; right: 0; }
    .corner.bl { bottom: 0; left: 0; }
    .corner.br { bottom: 0; right: 0; }

    .eyebrow {
      margin: 0; font-size: 14px; font-weight: 500;
      letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent-text);
    }
    h1 {
      margin: 0; font-family: var(--display); font-weight: 400;
      font-size: clamp(52px, 8.5vw, 116px); line-height: 0.98;
      letter-spacing: -0.01em; max-width: 11ch;
    }
    .marker { display: flex; align-items: center; }
    .marker span:first-child { width: 120px; height: 3px; background: var(--accent); }
    .marker span:last-child {
      width: 10px; height: 10px; border: 2px solid var(--accent); border-radius: 50%;
    }

    .actions { display: flex; flex-wrap: wrap; gap: 12px; }
    .btn {
      display: inline-flex; align-items: center; gap: 10px;
      min-height: 52px; padding: 0 24px;
      font-family: var(--mono); font-weight: 500; font-size: 15px;
      letter-spacing: 0.08em; text-transform: uppercase; text-decoration: none;
      transition: background-color .15s, color .15s, border-color .15s;
    }
    .btn-primary { background: var(--ink); color: var(--cream); }
    .btn-primary:hover { background: var(--accent); color: var(--cream); }
    .btn-ghost { border: 1.5px solid var(--ink); color: var(--ink); background: rgba(232,215,180,0.6); }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    footer.wrap { padding-bottom: 40px; }
    .foot {
      border-top: 1.5px solid var(--ink); padding-top: 20px;
      display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between;
      font-size: 13px; color: var(--ink-soft);
    }

    @media (max-width: 700px) {
      main.wrap { padding-top: 48px; padding-bottom: 48px; }
      .frame { padding: 32px 22px; gap: 24px; }
      .name { font-size: 18px; }
      .map .data, .map .compass { display: none; }
      .map .contours { opacity: 0.6; }
    }
  </style>
</head>
